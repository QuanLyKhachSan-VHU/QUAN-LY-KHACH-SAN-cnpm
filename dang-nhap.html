
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - StayFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/dang-nhap.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <div class="login-logo">
                <img src="images/stayflow-logo.png" alt="StayFlow">
                <h2>STAYFLOW</h2>
                <p>HỆ THỐNG QUẢN LÝ KHÁCH SẠN</p>
            </div>

            <h4>Chào mừng trở lại!</h4>
            <p class="subtitle">Đăng nhập để tiếp tục quản lý khách sạn</p>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="ten_dang_nhap" class="form-label">
                        Tên đăng nhập
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="ten_dang_nhap"
                        placeholder="Nhập tên đăng nhập"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="mat_khau" class="form-label">
                        Mật khẩu
                    </label>
                    <input
                        type="password"
                        class="form-control"
                        id="mat_khau"
                        placeholder="Nhập mật khẩu"
                        required
                    >
                </div>

                <div id="loginMessage" class="mb-3"></div>

                <button type="submit" id="loginButton" class="btn-login">
                    ĐĂNG NHẬP
                </button>

            </form>

            <div class="login-footer">
                © 2026 StayFlow - Hotel Management System
            </div>

        </div>
    </div>

    <script src="js/dang-nhap.js"></script>
</body>
</html>
